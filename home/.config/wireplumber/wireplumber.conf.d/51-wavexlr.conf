monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-Elgato_Systems_Elgato_Wave_XLR-*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        device.disabled = false
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Elgato_Systems_Elgato_Wave_XLR-*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.always-process = true
        node.passive = false
      }
    }
  }
]
