[mgr]
cwd = { fg = "#{{ primary.hex }}" }

hovered         = { fg = "#{{ onSurface.hex }}", bg = "#{{ surfaceVariant.hex }}" }
preview_hovered = { underline = true }

find_keyword  = { fg = "#{{ secondary.hex }}", italic = true }
find_position = { fg = "#{{ tertiary.hex }}", bg = "reset", italic = true }

marker_copied   = { fg = "#{{ tertiary.hex }}", bg = "#{{ tertiary.hex }}" }
marker_cut      = { fg = "#{{ error.hex }}", bg = "#{{ error.hex }}" }
marker_marked   = { fg = "#{{ primary.hex }}", bg = "#{{ primary.hex }}" }
marker_selected = { fg = "#{{ secondary.hex }}", bg = "#{{ secondary.hex }}" }

tab_active   = { fg = "#{{ onPrimary.hex }}", bg = "#{{ primary.hex }}" }
tab_inactive = { fg = "#{{ onSurfaceVariant.hex }}", bg = "#{{ surfaceVariant.hex }}" }

border_symbol = "│"
border_style  = { fg = "#{{ outline.hex }}" }

[status]
separator_style = { fg = "#{{ surfaceVariant.hex }}", bg = "#{{ surfaceVariant.hex }}" }

mode_normal_main = { fg = "#{{ onPrimary.hex }}", bg = "#{{ primary.hex }}", bold = true }
mode_normal_alt  = { fg = "#{{ primary.hex }}", bg = "#{{ surfaceVariant.hex }}" }
mode_select_main = { fg = "#{{ onSecondary.hex }}", bg = "#{{ secondary.hex }}", bold = true }
mode_select_alt  = { fg = "#{{ secondary.hex }}", bg = "#{{ surfaceVariant.hex }}" }
mode_unset_main  = { fg = "#{{ onTertiary.hex }}", bg = "#{{ tertiary.hex }}", bold = true }
mode_unset_alt   = { fg = "#{{ tertiary.hex }}", bg = "#{{ surfaceVariant.hex }}" }

progress_label  = { fg = "#{{ onSurface.hex }}", bold = true }
progress_normal = { fg = "#{{ primary.hex }}", bg = "#{{ surfaceVariant.hex }}" }
progress_error  = { fg = "#{{ error.hex }}", bg = "#{{ surfaceVariant.hex }}" }

[input]
border = { fg = "#{{ primary.hex }}" }

[select]
border = { fg = "#{{ primary.hex }}" }
active = { fg = "#{{ secondary.hex }}" }

[tasks]
border  = { fg = "#{{ primary.hex }}" }
hovered = { underline = true }

[which]
cand            = { fg = "#{{ secondary.hex }}" }
rest            = { fg = "#{{ onSurfaceVariant.hex }}" }
desc            = { fg = "#{{ primary.hex }}" }
separator_style = { fg = "#{{ outline.hex }}" }

[notify]
title_info  = { fg = "#{{ primary.hex }}" }
title_warn  = { fg = "#{{ tertiary.hex }}" }
title_error = { fg = "#{{ error.hex }}" }